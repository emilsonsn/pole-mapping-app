<!-- maintenance.component.html -->
<div class="container mt-4">
  <h3 class="fw-bold mb-3">Nova Manutenção</h3>

  <div *ngIf="!form.get('pole_id')?.value" class="text-center">
    <button mat-raised-button color="primary" (click)="scanQRCode()">
      Escanear QR Code do Poste
    </button>

    <p class="mt-3">Ou digite o QR Code do poste</p>

    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>QR Code</mat-label>
      <input matInput [formControl]="manualQrCode">
    </mat-form-field>

    <button
      mat-raised-button
      color="accent"
      class="mt-2"
      type="button"
      (click)="confirmManualQrCode()"
    >
      Confirmar QR Code
    </button>
  </div>

  <form *ngIf="form.get('pole_id')?.value" [formGroup]="form" (ngSubmit)="submit()">
    <div class="row">
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Endereço</mat-label>
          <input matInput formControlName="address" readonly />
        </mat-form-field>
      </div>
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Número</mat-label>
          <input matInput formControlName="number" readonly />
        </mat-form-field>
      </div>      
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Bairro</mat-label>
          <input matInput formControlName="neighborhood" readonly />
        </mat-form-field>
      </div>
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Cidade</mat-label>
          <input matInput formControlName="city" readonly />
        </mat-form-field>
      </div>
    </div>

    <div class="mb-3" *ngIf="!isFinishing">
      <button
        mat-raised-button
        color="accent"
        type="button"
        (click)="takePhoto()"
      >
        Tirar Evidência Fotográfica
      </button>
    </div>

    <div *ngIf="!isFinishing">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Descrição (inicial)</mat-label>
        <textarea matInput formControlName="initial_description"></textarea>
      </mat-form-field>
    </div>

    <div *ngIf="isFinishing">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Descrição da manutenção (final)</mat-label>
        <textarea matInput formControlName="final_description"></textarea>
      </mat-form-field>

      <button mat-raised-button color="accent" type="button" (click)="takeConclusionPhoto()">
        Tirar Foto Final da Correção
      </button>
    </div>

    <div *ngIf="imagePreview" class="mb-3 text-center">
      <img
        [src]="imagePreview"
        alt="Preview"
        class="img-thumbnail mb-2"
        style="max-width: 300px;"
      />
      <div>
        <button
          mat-button
          color="primary"
          type="button"
          (click)="confirmPhoto()"
          [disabled]="(!isFinishing && photoConfirmedInitial) || (isFinishing && photoConfirmedFinal)"
        >
          Confirmar Foto
        </button>
        <button mat-button color="warn" type="button" (click)="discardPhoto()">
          Descartar Foto
        </button>
      </div>
    </div>

    <div class="text-end mt-4">
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="!form.valid || (isFinishing ? !photoConfirmedFinal : !photoConfirmedInitial) || loading"
      >
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Enviar Dados</span>
      </button>
    </div>
  </form>
</div>

<div *ngIf="loading"
     class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-white bg-opacity-50">
  <mat-spinner></mat-spinner>
</div>
