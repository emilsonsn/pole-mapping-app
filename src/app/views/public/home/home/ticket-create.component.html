<div class="p-3">
    <div *ngIf="!qrcodeDetected" class="text-center">
      <button class="btn btn-primary" (click)="scanQRCode()">Escanear QR Code</button>
    
      <p class="mt-2">Ou digite o QR Code do poste</p>
    
      <mat-form-field appearance="outline" class="w-100 mt-2">
        <mat-label>Digite o QR Code</mat-label>
        <input matInput type="text" [formControl]="manualQrCode" />
      </mat-form-field>
    
      <div class="mt-2">
        <button class="btn btn-success" (click)="confirmManualQrCode()">Confirmar</button>
      </div>
    </div>
    
    <form *ngIf="qrcodeDetected" [formGroup]="form" (ngSubmit)="submit()">
      <div class="row">
    
        <div class="col-md-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>QR Code</mat-label>
            <input matInput formControlName="qrcode" [disabled]="true" />
          </mat-form-field>
        </div>
    
        <div class="col-md-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Descrição do Problema</mat-label>
            <textarea
              matInput
              rows="4"
              formControlName="description"
              [disabled]="ticketExists"
            ></textarea>
          </mat-form-field>
        </div>
    
        <div class="col-md-12 mb-2" *ngIf="!ticketExists">
          <button mat-raised-button color="accent" type="button" (click)="takePhoto()">
            Fotografar Problema
          </button>
        </div>
    
        <div *ngIf="imagePreview" class="text-center mt-3">
          <img [src]="imagePreview" class="img-thumbnail" style="max-width:300px" />
        </div>
    
        <div class="col-md-12 text-end mt-3" *ngIf="!ticketExists">
          <button class="btn btn-primary" [disabled]="form.invalid || loading">
            Criar Ticket
          </button>
        </div>
    
      </div>
    </form>
    
    <div *ngIf="ticketExists" class="alert alert-info mt-3">
      Já existe um ticket aberto para este poste.
    </div>
</div>
